name: ESIP compatibility report
description: 报告已发布 ESIP 契约的兼容、实现或可靠性问题
title: "interop: "
labels: [protocol]
body:
  - type: textarea
    id: platforms
    attributes:
      label: 平台与使用场景
      description: 哪两个或更多平台需要通信？谁拥有最终状态写入权？
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 消息契约
      description: 命令、事件、查询或结果的字段、版本、权限和失败语义。
    validations:
      required: true
  - type: textarea
    id: reliability
    attributes:
      label: 可靠性与安全
      description: 如何处理重复、乱序、断线、幂等、认证和隐私？
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 上游范围
      options:
        - label: 这是现有契约的可复现兼容问题，不是未经邀请的新协议或权威语义提案
          required: true
